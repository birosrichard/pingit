name: macOS CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, feat/pr-comment-tracking]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: macOS build and tests
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Verify toolchain, build app, and run tests
        shell: bash
        run: bash scripts/ci-macos.sh

      - name: Upload build and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-build-and-test-diagnostics
          path: |
            build/ci/**/ci.log
            build/ci/**/TestResults.xcresult/**
          if-no-files-found: warn
          retention-days: 1
